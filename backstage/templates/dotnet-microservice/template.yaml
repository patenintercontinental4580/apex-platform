apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dotnet-microservice
  title: .NET 8 Microservice
  description: Scaffolds a production-ready .NET 8 Web API using the Apex Platform golden path, complete with OpenTelemetry, health checks, Key Vault integration, and CI/CD pipelines.
  tags:
    - dotnet
    - microservice
    - azure-container-apps
    - recommended
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Details
      required:
        - serviceName
        - owningTeam
        - description
      properties:
        serviceName:
          title: Service Name
          type: string
          description: >
            The name of your service. Must be lowercase, start with a letter,
            and contain only letters, numbers, and hyphens (3–30 characters).
          pattern: '^[a-z][a-z0-9-]{2,29}$'
          ui:autofocus: true
          ui:help: 'Examples: orders-api, payment-service, reporting-backend'
        owningTeam:
          title: Owning Team
          type: string
          description: The team responsible for this service.
          enum:
            - orders-team
            - payments-team
            - reporting-team
            - data-team
            - platform-team
          enumNames:
            - Orders Team
            - Payments Team
            - Reporting Team
            - Data Team
            - Platform Team
        description:
          title: Description
          type: string
          description: A brief description of what this service does.
          ui:widget: textarea
          ui:options:
            rows: 3
        system:
          title: System
          type: string
          description: The system this service belongs to.
          enum:
            - order-management
            - payment-processing
            - reporting
            - data-platform
          default: order-management

    - title: Infrastructure Options
      properties:
        environment:
          title: Initial Environment
          type: string
          description: The first environment to configure infrastructure for.
          enum:
            - dev
            - staging
          default: dev
        needsDatabase:
          title: Needs SQL Database?
          type: boolean
          description: Provision an Azure SQL Database for this service.
          default: false
        needsKeyVault:
          title: Needs Key Vault?
          type: boolean
          description: Provision a dedicated Azure Key Vault for this service.
          default: true

    - title: Repository Settings
      required:
        - repoOrg
      properties:
        repoOrg:
          title: Azure DevOps Organisation
          type: string
          description: The Azure DevOps organisation name.
          default: my-organisation
        repoProject:
          title: Azure DevOps Project
          type: string
          description: The Azure DevOps project name.
          default: apex-platform

  steps:
    - id: fetch-template
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ../../golden-paths/dotnet-microservice
        values:
          serviceName: ${{ parameters.serviceName }}
          owningTeam: ${{ parameters.owningTeam }}
          description: ${{ parameters.description }}
          system: ${{ parameters.system }}
          environment: ${{ parameters.environment }}
          needsDatabase: ${{ parameters.needsDatabase }}
          needsKeyVault: ${{ parameters.needsKeyVault }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        allowedHosts: ['dev.azure.com']
        description: ${{ parameters.description }}
        repoUrl: dev.azure.com?owner=${{ parameters.repoOrg }}&repo=${{ parameters.serviceName }}&organization=${{ parameters.repoOrg }}&project=${{ parameters.repoProject }}
        defaultBranch: main
        gitCommitMessage: 'feat: initial scaffold from Apex Platform template'

    - id: register
      name: Register in Backstage Catalogue
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalogue
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
