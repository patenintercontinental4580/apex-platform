# Reusable Terraform plan and apply pipeline template.
# Provides: fmt check, validate, tflint, checkov scan, plan, and optional apply with approval gate.
parameters:
  - name: workingDirectory
    type: string
  - name: environment
    type: string
    default: 'dev'
  - name: azureSubscription
    type: string
  - name: backendResourceGroupName
    type: string
    default: 'rg-apex-platform-tfstate-uks'
  - name: backendStorageAccountName
    type: string
    default: 'stapexplatformtfstate'
  - name: backendContainerName
    type: string
    default: 'tfstate'
  - name: backendStateKey
    type: string
  - name: terraformVersion
    type: string
    default: '1.7.0'
  - name: requireApprovalForProd
    type: boolean
    default: true

stages:
  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    jobs:
      - job: Plan
        displayName: 'Plan — ${{ parameters.workingDirectory }}'
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform ${{ parameters.terraformVersion }}'
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - script: pip install checkov
            displayName: 'Install Checkov'

          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
            displayName: 'Install tflint'

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd ${{ parameters.workingDirectory }}
                terraform init \
                  -backend-config="resource_group_name=${{ parameters.backendResourceGroupName }}" \
                  -backend-config="storage_account_name=${{ parameters.backendStorageAccountName }}" \
                  -backend-config="container_name=${{ parameters.backendContainerName }}" \
                  -backend-config="key=${{ parameters.backendStateKey }}"

          - task: AzureCLI@2
            displayName: 'Terraform Format Check'
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd ${{ parameters.workingDirectory }}
                terraform fmt -check -recursive
                echo "Terraform format check passed"

          - task: AzureCLI@2
            displayName: 'Terraform Validate'
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd ${{ parameters.workingDirectory }}
                terraform validate
                echo "Terraform validate passed"

          - script: |
              cd ${{ parameters.workingDirectory }}
              tflint --init
              tflint --recursive
              echo "tflint passed"
            displayName: 'tflint'

          - script: |
              checkov -d ${{ parameters.workingDirectory }} \
                --framework terraform \
                --quiet \
                --soft-fail-on LOW
              echo "Checkov scan complete"
            displayName: 'Checkov Security Scan'

          - task: AzureCLI@2
            displayName: 'Terraform Plan'
            name: TfPlan
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd ${{ parameters.workingDirectory }}
                set +e
                terraform plan \
                  -out=tfplan \
                  -detailed-exitcode \
                  -var="environment=${{ parameters.environment }}"
                PLAN_EXIT_CODE=$?
                set -e

                if [[ $PLAN_EXIT_CODE -eq 0 ]]; then
                  echo "No changes detected."
                  echo "##vso[task.setvariable variable=CHANGES_DETECTED;isOutput=true]false"
                elif [[ $PLAN_EXIT_CODE -eq 2 ]]; then
                  echo "Changes detected. Plan saved to tfplan."
                  echo "##vso[task.setvariable variable=CHANGES_DETECTED;isOutput=true]true"
                else
                  echo "Terraform plan failed with exit code $PLAN_EXIT_CODE"
                  exit $PLAN_EXIT_CODE
                fi

          - task: PublishPipelineArtifact@1
            displayName: 'Publish tfplan artifact'
            condition: eq(variables['TfPlan.CHANGES_DETECTED'], 'true')
            inputs:
              targetPath: '${{ parameters.workingDirectory }}/tfplan'
              artifact: tfplan-${{ parameters.environment }}

  - stage: TerraformApply
    displayName: 'Terraform Apply'
    dependsOn: TerraformPlan
    condition: >
      and(
        succeeded('TerraformPlan'),
        eq(dependencies.TerraformPlan.outputs['Plan.TfPlan.CHANGES_DETECTED'], 'true')
      )
    ${{ if and(parameters.requireApprovalForProd, eq(parameters.environment, 'prod')) }}:
      jobs:
        - deployment: Apply
          displayName: 'Apply — ${{ parameters.workingDirectory }}'
          pool:
            vmImage: ubuntu-latest
          environment: production
          strategy:
            runOnce:
              deploy:
                steps:
                  - template: ../steps/backup-terraform-state.yml
                    parameters:
                      stateKey: ${{ parameters.backendStateKey }}
                      azureSubscription: ${{ parameters.azureSubscription }}

                  - task: DownloadPipelineArtifact@2
                    displayName: 'Download tfplan'
                    inputs:
                      artifact: tfplan-${{ parameters.environment }}
                      path: ${{ parameters.workingDirectory }}

                  - task: TerraformInstaller@1
                    displayName: 'Install Terraform ${{ parameters.terraformVersion }}'
                    inputs:
                      terraformVersion: ${{ parameters.terraformVersion }}

                  - task: AzureCLI@2
                    displayName: 'Terraform Apply'
                    inputs:
                      azureSubscription: ${{ parameters.azureSubscription }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        export ARM_CLIENT_ID=$servicePrincipalId
                        export ARM_CLIENT_SECRET=$servicePrincipalKey
                        export ARM_TENANT_ID=$tenantId
                        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                        cd ${{ parameters.workingDirectory }}
                        terraform init \
                          -backend-config="resource_group_name=${{ parameters.backendResourceGroupName }}" \
                          -backend-config="storage_account_name=${{ parameters.backendStorageAccountName }}" \
                          -backend-config="container_name=${{ parameters.backendContainerName }}" \
                          -backend-config="key=${{ parameters.backendStateKey }}"
                        terraform apply tfplan
    ${{ else }}:
      jobs:
        - job: Apply
          displayName: 'Apply — ${{ parameters.workingDirectory }}'
          pool:
            vmImage: ubuntu-latest
          steps:
            - checkout: self

            - template: ../steps/backup-terraform-state.yml
              parameters:
                stateKey: ${{ parameters.backendStateKey }}
                azureSubscription: ${{ parameters.azureSubscription }}

            - task: DownloadPipelineArtifact@2
              displayName: 'Download tfplan'
              inputs:
                artifact: tfplan-${{ parameters.environment }}
                path: ${{ parameters.workingDirectory }}

            - task: TerraformInstaller@1
              displayName: 'Install Terraform ${{ parameters.terraformVersion }}'
              inputs:
                terraformVersion: ${{ parameters.terraformVersion }}

            - task: AzureCLI@2
              displayName: 'Terraform Apply'
              inputs:
                azureSubscription: ${{ parameters.azureSubscription }}
                scriptType: bash
                scriptLocation: inlineScript
                addSpnToEnvironment: true
                inlineScript: |
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_CLIENT_SECRET=$servicePrincipalKey
                  export ARM_TENANT_ID=$tenantId
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                  cd ${{ parameters.workingDirectory }}
                  terraform init \
                    -backend-config="resource_group_name=${{ parameters.backendResourceGroupName }}" \
                    -backend-config="storage_account_name=${{ parameters.backendStorageAccountName }}" \
                    -backend-config="container_name=${{ parameters.backendContainerName }}" \
                    -backend-config="key=${{ parameters.backendStateKey }}"
                  terraform apply tfplan
