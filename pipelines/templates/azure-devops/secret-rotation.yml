# Apex Platform: Azure DevOps — Secret Rotation Pipeline Template
#
# Scheduled pipeline that orchestrates automated secret rotation across
# platform Key Vaults by invoking the rotation Azure Function provisioned
# by the azure-secret-rotation Terraform module.
#
# Usage: extend this template from a team's azure-pipelines.yml:
#
#   resources:
#     repositories:
#       - repository: platform-templates
#         type: git
#         name: apex-platform/apex-platform
#   extends:
#     template: pipelines/templates/azure-devops/secret-rotation.yml@platform-templates
#     parameters:
#       keyVaultName: kv-myapp-prod-uks-01
#       rotationFunctionUrl: https://func-rotation-prod-uks-01.azurewebsites.net
#       azureSubscription: sc-apex-platform-prod
#
# Required Azure DevOps environment: 'production' (with approval gate for prod).

parameters:
  - name: keyVaultName
    type: string
  - name: rotationFunctionUrl
    type: string
  - name: azureSubscription
    type: string
  - name: environment
    type: string
    default: 'prod'
  - name: secretTypes
    type: object
    default:
      - 'database-password'
  - name: teamsWebhookUrl
    type: string
    default: ''
  - name: notifyOnSuccess
    type: boolean
    default: false

schedules:
  - cron: '0 2 * * 0'
    displayName: 'Weekly Sunday 02:00 UTC secret rotation'
    branches:
      include:
        - main
    always: true

trigger: none

stages:
  - stage: RotateSecrets
    displayName: 'Rotate Secrets — ${{ parameters.keyVaultName }}'
    jobs:
      - deployment: Rotate
        displayName: 'Invoke Rotation Function'
        pool:
          vmImage: ubuntu-latest
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Invoke secret rotation for each secret type'
                  name: RotationResult
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      KEY_VAULT="${{ parameters.keyVaultName }}"
                      FUNCTION_URL="${{ parameters.rotationFunctionUrl }}"
                      ROTATION_FAILED=false

                      # Obtain an AAD token to authenticate the Function call
                      FUNCTION_KEY=$(az functionapp keys list \
                        --name "${FUNCTION_URL##*//}" \
                        --resource-group "$(az functionapp list --query "[?defaultHostName=='${FUNCTION_URL##*//}'].resourceGroup" -o tsv 2>/dev/null || echo '')" \
                        --query "functionKeys.default" -o tsv 2>/dev/null || echo '')

                      SECRET_TYPES='${{ convertToJson(parameters.secretTypes) }}'

                      echo "$SECRET_TYPES" | jq -r '.[]' | while read -r SECRET_TYPE; do
                        echo "--- Rotating secret type: ${SECRET_TYPE} in ${KEY_VAULT} ---"

                        PAYLOAD=$(jq -n \
                          --arg kv  "$KEY_VAULT" \
                          --arg st  "$SECRET_TYPE" \
                          '{"keyVaultName": $kv, "secretType": $st}')

                        HTTP_CODE=$(curl -s -o /tmp/rotation-response.json -w "%{http_code}" \
                          -X POST \
                          -H "Content-Type: application/json" \
                          -H "x-functions-key: ${FUNCTION_KEY}" \
                          -d "$PAYLOAD" \
                          "${FUNCTION_URL}/api/rotate-secret")

                        if [[ "$HTTP_CODE" == "200" ]]; then
                          echo "Rotation succeeded for ${SECRET_TYPE}."
                          cat /tmp/rotation-response.json
                        else
                          echo "##[error]Rotation FAILED for ${SECRET_TYPE}. HTTP ${HTTP_CODE}."
                          cat /tmp/rotation-response.json || true
                          ROTATION_FAILED=true
                        fi
                      done

                      if [[ "$ROTATION_FAILED" == "true" ]]; then
                        echo "##vso[task.setvariable variable=ROTATION_FAILED;isOutput=true]true"
                        exit 1
                      fi
                      echo "##vso[task.setvariable variable=ROTATION_FAILED;isOutput=true]false"

                - task: AzureCLI@2
                  displayName: 'Validate — confirm new secret versions exist in Key Vault'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      KEY_VAULT="${{ parameters.keyVaultName }}"

                      echo "Verifying new secret versions were created in ${KEY_VAULT}..."
                      SECRET_TYPES='${{ convertToJson(parameters.secretTypes) }}'

                      echo "$SECRET_TYPES" | jq -r '.[]' | while read -r SECRET_TYPE; do
                        LATEST_VERSION=$(az keyvault secret list-versions \
                          --vault-name "$KEY_VAULT" \
                          --name "$SECRET_TYPE" \
                          --query "sort_by([?attributes.enabled], &attributes.created)[-1].id" \
                          -o tsv 2>/dev/null || echo '')

                        if [[ -z "$LATEST_VERSION" ]]; then
                          echo "##[error]Could not find an enabled version for secret '${SECRET_TYPE}' in ${KEY_VAULT}."
                          exit 1
                        fi

                        CREATED_DATE=$(az keyvault secret list-versions \
                          --vault-name "$KEY_VAULT" \
                          --name "$SECRET_TYPE" \
                          --query "sort_by([?attributes.enabled], &attributes.created)[-1].attributes.created" \
                          -o tsv)

                        echo "Secret '${SECRET_TYPE}' — latest enabled version created at: ${CREATED_DATE}."
                      done
                      echo "Validation complete. All secret types have current versions."

  - stage: NotifyFailure
    displayName: 'Notify on Rotation Failure'
    dependsOn: RotateSecrets
    condition: failed()
    jobs:
      - job: Notify
        displayName: 'Send failure notification'
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              if [[ -z "${{ parameters.teamsWebhookUrl }}" ]]; then
                echo "No Teams webhook configured. Skipping notification."
                exit 0
              fi

              RUNBOOK_URL="https://github.com/your-org/apex-platform/blob/main/docs/runbooks/secret-rotation-failure.md"
              PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

              PAYLOAD=$(cat <<EOF
              {
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "FF0000",
                "summary": "Secret Rotation Failure",
                "sections": [{
                  "activityTitle": "Secret Rotation Failed",
                  "activitySubtitle": "Key Vault: ${{ parameters.keyVaultName }} | Environment: ${{ parameters.environment }}",
                  "facts": [
                    { "name": "Key Vault", "value": "${{ parameters.keyVaultName }}" },
                    { "name": "Environment", "value": "${{ parameters.environment }}" },
                    { "name": "Pipeline Run", "value": "$(Build.BuildNumber)" },
                    { "name": "Triggered By", "value": "$(Build.RequestedFor)" }
                  ],
                  "text": "Automated secret rotation failed. Secrets may not have been rotated. Immediate investigation is required. Follow the [Secret Rotation Failure runbook](${RUNBOOK_URL}) for remediation steps."
                }],
                "potentialAction": [
                  {
                    "@type": "OpenUri",
                    "name": "View Pipeline Logs",
                    "targets": [{ "os": "default", "uri": "${PIPELINE_URL}" }]
                  },
                  {
                    "@type": "OpenUri",
                    "name": "Open Runbook",
                    "targets": [{ "os": "default", "uri": "${RUNBOOK_URL}" }]
                  }
                ]
              }
              EOF
              )

              curl -s -H "Content-Type: application/json" -d "${PAYLOAD}" "${{ parameters.teamsWebhookUrl }}"
              echo "Teams failure notification sent."
            displayName: 'Send Teams failure alert'
