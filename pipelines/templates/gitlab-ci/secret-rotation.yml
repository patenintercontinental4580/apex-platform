# Apex Platform: GitLab CI — Secret Rotation Pipeline Template
#
# Mirrors pipelines/templates/azure-devops/secret-rotation.yml 1:1.
# Orchestrates automated secret rotation across platform Key Vaults by
# invoking the rotation Azure Function provisioned by the
# azure-secret-rotation Terraform module.
#
# Required CI/CD variables (set in project or group settings):
#   AZURE_TENANT_ID           — Entra ID tenant
#   AZURE_SUBSCRIPTION_ID     — Target subscription
#   AZURE_CLIENT_ID           — Service principal client ID (OIDC)
#   KEY_VAULT_NAME            — e.g. kv-myapp-prod-uks-01
#   ROTATION_FUNCTION_URL     — e.g. https://func-rotation-prod-uks-01.azurewebsites.net
#   ROTATION_FUNCTION_KEY     — Azure Function host key (masked variable)
#   SECRET_TYPES              — JSON array e.g. '["database-password","storage-key"]'
#   TEAMS_WEBHOOK_URL         — (optional) incoming webhook for failure alerts
#   ENVIRONMENT               — e.g. prod

stages:
  - rotate-secrets
  - validate-rotation
  - notify-failure

variables:
  ENVIRONMENT: "prod"
  SECRET_TYPES: '["database-password"]'

# ---------------------------------------------------------------------------
.azure-oidc-login: &azure-oidc-login
  - az login
      --service-principal
      --federated-token "$CI_JOB_JWT_V2"
      --tenant "$AZURE_TENANT_ID"
      --username "$AZURE_CLIENT_ID"
      --allow-no-subscriptions
  - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

# ---------------------------------------------------------------------------
rotate-secrets:
  stage: rotate-secrets
  image: mcr.microsoft.com/azure-cli:latest
  before_script:
    - *azure-oidc-login
    - apt-get update -qq && apt-get install -y -qq curl jq
  script:
    - |
      set -euo pipefail
      echo "Starting secret rotation for Key Vault: ${KEY_VAULT_NAME}"
      ROTATION_FAILED=false

      echo "$SECRET_TYPES" | jq -r '.[]' | while read -r SECRET_TYPE; do
        echo "--- Rotating: ${SECRET_TYPE} ---"

        PAYLOAD=$(jq -n \
          --arg kv "$KEY_VAULT_NAME" \
          --arg st "$SECRET_TYPE" \
          '{"keyVaultName": $kv, "secretType": $st}')

        HTTP_CODE=$(curl -s \
          -o /tmp/rotation-response.json \
          -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -H "x-functions-key: ${ROTATION_FUNCTION_KEY}" \
          -d "$PAYLOAD" \
          "${ROTATION_FUNCTION_URL}/api/rotate-secret")

        if [[ "$HTTP_CODE" == "200" ]]; then
          echo "Rotation succeeded for '${SECRET_TYPE}'."
          cat /tmp/rotation-response.json
        else
          echo "ERROR: Rotation FAILED for '${SECRET_TYPE}'. HTTP status: ${HTTP_CODE}."
          cat /tmp/rotation-response.json || true
          ROTATION_FAILED=true
        fi
      done

      if [[ "$ROTATION_FAILED" == "true" ]]; then
        echo "ROTATION_FAILED=true" >> rotation.env
        exit 1
      fi

      echo "ROTATION_FAILED=false" >> rotation.env
      echo "All secret types rotated successfully."
  artifacts:
    when: always
    reports:
      dotenv: rotation.env
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
validate-rotation:
  stage: validate-rotation
  image: mcr.microsoft.com/azure-cli:latest
  needs:
    - job: rotate-secrets
      artifacts: true
  before_script:
    - *azure-oidc-login
    - apt-get update -qq && apt-get install -y -qq jq
  script:
    - |
      set -euo pipefail
      echo "Validating new secret versions exist in ${KEY_VAULT_NAME}..."
      sleep 10

      echo "$SECRET_TYPES" | jq -r '.[]' | while read -r SECRET_TYPE; do
        LATEST=$(az keyvault secret list-versions \
          --vault-name "$KEY_VAULT_NAME" \
          --name "$SECRET_TYPE" \
          --query "sort_by([?attributes.enabled], &attributes.created)[-1].id" \
          -o tsv 2>/dev/null || echo '')

        if [[ -z "$LATEST" ]]; then
          echo "ERROR: No enabled version found for secret '${SECRET_TYPE}'."
          exit 1
        fi

        CREATED=$(az keyvault secret list-versions \
          --vault-name "$KEY_VAULT_NAME" \
          --name "$SECRET_TYPE" \
          --query "sort_by([?attributes.enabled], &attributes.created)[-1].attributes.created" \
          -o tsv)

        echo "Secret '${SECRET_TYPE}' — latest version created at: ${CREATED}."
      done
      echo "Validation complete. All secret types have current enabled versions."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
notify-failure:
  stage: notify-failure
  image: curlimages/curl:latest
  needs:
    - job: rotate-secrets
      artifacts: true
  script:
    - |
      if [[ -z "$TEAMS_WEBHOOK_URL" ]]; then
        echo "TEAMS_WEBHOOK_URL not configured. Skipping notification."
        exit 0
      fi

      PIPELINE_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}"
      RUNBOOK_URL="https://github.com/your-org/apex-platform/blob/main/docs/runbooks/secret-rotation-failure.md"

      PAYLOAD=$(printf '{
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "FF0000",
        "summary": "Secret Rotation Failure",
        "sections": [{
          "activityTitle": "Secret Rotation Failed",
          "activitySubtitle": "Key Vault: %s | Environment: %s",
          "facts": [
            { "name": "Key Vault", "value": "%s" },
            { "name": "Environment", "value": "%s" },
            { "name": "Project", "value": "%s" },
            { "name": "Pipeline", "value": "%s" }
          ],
          "text": "Automated secret rotation failed. Secrets may be stale. Immediate investigation is required. Follow the Secret Rotation Failure runbook for remediation steps."
        }],
        "potentialAction": [
          { "@type": "OpenUri", "name": "View Pipeline", "targets": [{ "os": "default", "uri": "%s" }] },
          { "@type": "OpenUri", "name": "Open Runbook", "targets": [{ "os": "default", "uri": "%s" }] }
        ]
      }' \
        "$KEY_VAULT_NAME" "$ENVIRONMENT" \
        "$KEY_VAULT_NAME" "$ENVIRONMENT" \
        "$CI_PROJECT_NAME" "$PIPELINE_URL" \
        "$PIPELINE_URL" "$RUNBOOK_URL")

      curl -s -o /dev/null -w "%{http_code}\n" \
        -H "Content-Type: application/json" \
        -d "$PAYLOAD" \
        "$TEAMS_WEBHOOK_URL"
      echo "Teams failure notification sent."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_failure
