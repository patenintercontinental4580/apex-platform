# Apex Platform: GitLab CI — Terraform Lint Pipeline Template
#
# Mirrors pipelines/templates/azure-devops/terraform-lint.yml 1:1.
# Runs terraform fmt, validate, tflint, checkov, and SonarQube on every
# merge request or push that touches Terraform files.
# Used by both module repositories and environment configuration repositories.
#
# Usage — include in your .gitlab-ci.yml:
#
#   include:
#     - project: 'your-org/apex-platform'
#       ref: main
#       file: 'pipelines/templates/gitlab-ci/terraform-lint.yml'
#
# Required CI/CD variables:
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_CLIENT_ID (OIDC)
# Optional:
#   TF_WORKING_DIRECTORY  (default: .)
#   TFLINT_VERSION        (default: 0.50.3)
#   SONAR_HOST_URL        SonarQube server URL
#   SONAR_TOKEN           SonarQube authentication token (masked)
#   SONAR_PROJECT_KEY     SonarQube project key

stages:
  - lint

variables:
  TERRAFORM_VERSION: "1.7.0"
  TFLINT_VERSION: "0.50.3"
  TF_WORKING_DIRECTORY: "."
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"

# ---------------------------------------------------------------------------
.azure-oidc-login: &azure-oidc-login
  - az login
      --service-principal
      --federated-token "$CI_JOB_JWT_V2"
      --tenant "$AZURE_TENANT_ID"
      --username "$AZURE_CLIENT_ID"
      --allow-no-subscriptions
  - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_ID="$AZURE_CLIENT_ID"
  - export ARM_USE_OIDC=true
  - export ARM_OIDC_TOKEN="$CI_JOB_JWT_V2"
  - export ARM_TENANT_ID="$AZURE_TENANT_ID"
  - export ARM_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID"

# ---------------------------------------------------------------------------
terraform-lint:
  stage: lint
  image:
    name: hashicorp/terraform:$TERRAFORM_VERSION
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl bash jq python3 py3-pip git
    - curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash 2>/dev/null ||
        apk add --no-cache azure-cli
    - *azure-oidc-login
    - |
      curl -L \
        "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
        -o /tmp/tflint.zip
      unzip -o /tmp/tflint.zip -d /usr/local/bin/
      rm /tmp/tflint.zip
      tflint --version
    - pip install checkov --quiet
  script:
    - |
      echo "=== Working directory: ${TF_WORKING_DIRECTORY} ==="

      # -----------------------------------------------------------------------
      echo "--- terraform fmt check ---"
      terraform fmt -check -recursive "${TF_WORKING_DIRECTORY}" || {
        echo "ERROR: terraform fmt check failed. Run 'terraform fmt -recursive' to fix."
        exit 1
      }
      echo "terraform fmt: PASSED"

      # -----------------------------------------------------------------------
      echo "--- terraform validate ---"
      find "${TF_WORKING_DIRECTORY}" \
        -name "*.tf" \
        -not -path "*/.terraform/*" \
        -not -path "*/examples/*" \
        | xargs -I{} dirname {} | sort -u | while read -r dir; do
          echo "  Validating: $dir"
          terraform -chdir="$dir" init -backend=false -input=false -no-color
          terraform -chdir="$dir" validate -no-color
      done
      echo "terraform validate: PASSED"

      # -----------------------------------------------------------------------
      echo "--- tflint ---"
      tflint --init 2>/dev/null || true
      find "${TF_WORKING_DIRECTORY}" \
        -name "*.tf" \
        -not -path "*/.terraform/*" \
        -not -path "*/examples/*" \
        | xargs -I{} dirname {} | sort -u | while read -r dir; do
          echo "  tflint: $dir"
          tflint --chdir="$dir" --format compact
      done
      echo "tflint: PASSED"

      # -----------------------------------------------------------------------
      echo "--- Checkov security scan ---"
      checkov \
        --directory "${TF_WORKING_DIRECTORY}" \
        --framework terraform \
        --quiet \
        --compact \
        --output cli \
        --output junitxml \
        --output-file-path "${CI_PROJECT_DIR}/checkov-results.xml"
      echo "Checkov: PASSED"

      # -----------------------------------------------------------------------
      echo "=============================="
      echo " Terraform lint summary"
      echo "=============================="
      echo "  PASSED  terraform fmt"
      echo "  PASSED  terraform validate"
      echo "  PASSED  tflint"
      echo "  PASSED  Checkov"
      echo "=============================="
  artifacts:
    when: always
    paths:
      - checkov-results.xml
    reports:
      junit: checkov-results.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.tf"
        - "**/*.tfvars"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.tf"
        - "**/*.tfvars"
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
sonarqube-scan:
  stage: lint
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - |
      if [[ -z "${SONAR_HOST_URL:-}" ]] || [[ -z "${SONAR_TOKEN:-}" ]]; then
        echo "SONAR_HOST_URL or SONAR_TOKEN not set. Skipping SonarQube scan."
        exit 0
      fi

      sonar-scanner \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY:-apex-platform-terraform}" \
        -Dsonar.projectName="${SONAR_PROJECT_KEY:-apex-platform-terraform}" \
        -Dsonar.sources="${TF_WORKING_DIRECTORY}" \
        -Dsonar.inclusions="**/*.tf" \
        -Dsonar.exclusions="**/.terraform/**,**/examples/**" \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.login="$SONAR_TOKEN"
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.tf"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
