name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ─── Terraform native tests ────────────────────────────────────────────────
  terraform-tests:
    name: Terraform Module Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Run terraform test (all modules)
        run: |
          set -euo pipefail
          FAILED=0

          find terraform/modules -maxdepth 1 -mindepth 1 -type d | sort | while read -r module_dir; do
            test_dir="${module_dir}/tests"
            if [ -d "$test_dir" ] && find "$test_dir" -name "*.tftest.hcl" | grep -q .; then
              echo "::group::terraform test — ${module_dir}"
              terraform -chdir="${module_dir}" init -backend=false -input=false -no-color
              terraform -chdir="${module_dir}" test -no-color || FAILED=1
              echo "::endgroup::"
            fi
          done

          exit $FAILED

  # ─── OPA policy tests ──────────────────────────────────────────────────────
  opa-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run OPA tests
        run: |
          opa test policies/opa/ -v --format pretty

  # ─── Python compliance script tests ───────────────────────────────────────
  python-tests:
    name: Python Compliance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r scripts/compliance/requirements-test.txt

      - name: Run pytest
        run: |
          pytest scripts/compliance/tests/ \
            -v \
            --tb=short \
            --cov=scripts/compliance \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ─── React Vitest tests ────────────────────────────────────────────────────
  react-tests:
    name: React Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: golden-paths/react-frontend
        run: npm install

      - name: Run Vitest
        working-directory: golden-paths/react-frontend
        env:
          VITE_AZURE_CLIENT_ID: "test-client-id"
          VITE_AZURE_TENANT_ID: "test-tenant-id"
        run: npm test

      - name: Run coverage check
        working-directory: golden-paths/react-frontend
        env:
          VITE_AZURE_CLIENT_ID: "test-client-id"
          VITE_AZURE_TENANT_ID: "test-tenant-id"
        run: npm run test:coverage
